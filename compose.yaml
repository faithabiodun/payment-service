services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "5433:5432"
    volumes:
      - payment-service-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d payment_service"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/payment_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?Set PAYSTACK_SECRET_KEY to a Paystack test secret}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-http://localhost:8080/api/v1/payments/callback}
      API_CUSTOMER_USERNAME: ${API_CUSTOMER_USERNAME:?Set API_CUSTOMER_USERNAME}
      API_CUSTOMER_PASSWORD: ${API_CUSTOMER_PASSWORD:?Set API_CUSTOMER_PASSWORD}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:?Set API_ADMIN_USERNAME}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:?Set API_ADMIN_PASSWORD}
      API_MONITORING_USERNAME: ${API_MONITORING_USERNAME:?Set API_MONITORING_USERNAME}
      API_MONITORING_PASSWORD: ${API_MONITORING_PASSWORD:?Set API_MONITORING_PASSWORD}
      FLUTTERWAVE_V3_SECRET_KEY: ${FLUTTERWAVE_V3_SECRET_KEY:-}
      FLUTTERWAVE_V3_WEBHOOK_SECRET_HASH: ${FLUTTERWAVE_V3_WEBHOOK_SECRET_HASH:-}
      FLUTTERWAVE_V4_CLIENT_ID: ${FLUTTERWAVE_V4_CLIENT_ID:-}
      FLUTTERWAVE_V4_CLIENT_SECRET: ${FLUTTERWAVE_V4_CLIENT_SECRET:-}
      FLUTTERWAVE_V4_WEBHOOK_SECRET_HASH: ${FLUTTERWAVE_V4_WEBHOOK_SECRET_HASH:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_DEFAULT_PROVIDER: ${PAYMENT_DEFAULT_PROVIDER:-PAYSTACK}
      RECONCILIATION_PAYMENT_STALE_AFTER: ${RECONCILIATION_PAYMENT_STALE_AFTER:-PT10M}
      RECONCILIATION_ABANDON_AFTER: ${RECONCILIATION_ABANDON_AFTER:-PT24H}
      RECONCILIATION_REFUND_STALE_AFTER: ${RECONCILIATION_REFUND_STALE_AFTER:-PT10M}
      RECONCILIATION_MAX_ATTEMPTS: ${RECONCILIATION_MAX_ATTEMPTS:-5}
      RECONCILIATION_BATCH_SIZE: ${RECONCILIATION_BATCH_SIZE:-100}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.14.0
    depends_on:
      - app
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - payment-service-prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - payment-service-grafana:/var/lib/grafana

volumes:
  payment-service-postgres:
  payment-service-prometheus:
  payment-service-grafana:

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: payment-service
          metrics_path: /actuator/prometheus
          basic_auth:
            username: "${API_MONITORING_USERNAME:?Set API_MONITORING_USERNAME}"
            password: "${API_MONITORING_PASSWORD:?Set API_MONITORING_PASSWORD}"
          static_configs:
            - targets: [app:8080]
